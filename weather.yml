name: Wettermodelle Mering

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These four slots cover both CET and CEST.
    - cron: "40 3,4,13,14 * * *"

permissions:
  contents: write

concurrency:
  group: mering-model-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check local Berlin schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$hour" == "05" || "$hour" == "15" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch model data
        if: steps.clock.outputs.run == 'true'
        run: python scripts/fetch_models.py

      - name: Commit JSON
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mering_models.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Mering model data"
            git push
          fi
