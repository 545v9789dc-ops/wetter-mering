name: Wettermodelle Mering

on:
  workflow_dispatch:
  schedule:
    # UTC alternatives for local times 02:00, 05:00, 10:00, 15:00, 18:00.
    - cron: "0 0,1,3,4,8,9,13,14,16,17 * * *"
    # UTC alternatives for local time 21:30.
    - cron: "30 19,20 * * *"

permissions:
  contents: write

concurrency:
  group: mering-model-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check Berlin local schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_hm=$(TZ=Europe/Berlin date +%H:%M)
          local_hour=${local_hm%%:*}
          local_min=${local_hm##*:}
          run=false
          if [[ "$local_hour" =~ ^(02|05|10|15|18)$ ]] && (( 10#$local_min < 30 )); then
            run=true
          fi
          if [[ "$local_hour" == "21" ]] && (( 10#$local_min >= 30 )); then
            run=true
          fi
          # At the October DST fallback, 02:00 occurs twice; use the first occurrence.
          if [[ "$local_hour" == "02" && "$(TZ=Europe/Berlin date +%z)" == "+0100" ]] && [[ "$(date -u +%m)" == "10" ]]; then
            # Skip only if this is the duplicated 02:00 hour on the DST transition day.
            local_day=$(TZ=Europe/Berlin date +%d)
            local_dow=$(TZ=Europe/Berlin date +%u)
            local_tomorrow=$(TZ=Europe/Berlin date -d tomorrow +%m)
            if [[ "$local_dow" == "7" && "$local_tomorrow" == "11" ]]; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Local Berlin time: $local_hm; run=$run"

      - name: Checkout
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test forecast validation
        if: steps.clock.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Fetch model data
        id: fetch
        if: steps.clock.outputs.run == 'true'
        run: python scripts/fetch_models.py

      - name: Fetch MOSMIX data (non-critical)
        if: steps.clock.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_mosmix.py

      - name: Fetch ensemble data (non-critical)
        if: steps.clock.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_ensembles.py

      - name: Commit JSON
        if: always() && steps.fetch.outcome != 'skipped' && steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mering_models.json
          if [[ -f data/mering_mosmix.json ]]; then
            git add data/mering_mosmix.json
          fi
          if [[ -f data/mering_ensembles.json ]]; then
            git add data/mering_ensembles.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Mering model, MOSMIX and ensemble data"
            git push
          fi
