name: Wettermodelle Mering

on:
  workflow_dispatch:
  schedule:
    # Separate entries make github.event.schedule identify the UTC slot.
    # Berlin targets: 02:00, 05:00, 10:00, 15:00, 18:00, 21:30.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: mering-model-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Check Berlin local schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/weather_schedule.py

      - name: Set up Python
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Test forecast validation
        if: steps.clock.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Fetch model data
        id: fetch
        if: steps.clock.outputs.run == 'true'
        run: python scripts/fetch_models.py

      - name: Fetch MOSMIX data (non-critical)
        id: mosmix
        if: steps.clock.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_mosmix.py

      - name: Fetch ensemble data (non-critical)
        id: ensembles
        if: steps.clock.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_ensembles.py

      - name: Compute winter metrics (non-critical)
        id: winter
        if: steps.clock.outputs.run == 'true' && steps.fetch.outcome == 'success'
        continue-on-error: true
        run: python scripts/winter_metrics.py

      - name: Validate collected data
        id: quality
        if: always() && steps.clock.outputs.run == 'true' && steps.fetch.outcome != 'skipped'
        continue-on-error: true
        run: python scripts/validate_data_quality.py

      - name: Commit JSON with bounded retries
        if: always() && steps.clock.outputs.run == 'true' && steps.fetch.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mering_models.json
          if [[ -f data/mering_mosmix.json ]]; then git add data/mering_mosmix.json; fi
          if [[ -f data/mering_ensembles.json ]]; then git add data/mering_ensembles.json; fi
          if git diff --cached --quiet; then
            echo 'No JSON changes to commit.'
            exit 0
          fi
          git commit -m "Update Mering model, MOSMIX and ensemble data"
          # Never force-push; the rebase is retried only for concurrent fast-forward changes.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict: manual investigation required; no force push.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 3)); fi
          done
          echo 'Push failed after three attempts.' >&2
          exit 1

      - name: Report winter enrichment failure
        if: always() && steps.clock.outputs.run == 'true' && steps.winter.outcome == 'failure'
        run: echo '::warning::Winter metrics enrichment failed; core model data retained.'

      - name: Flag critical data quality
        if: always() && steps.clock.outputs.run == 'true' && steps.quality.outcome == 'failure'
        run: |
          echo 'Data quality validation failed; inspect previous step.' >&2
          exit 1
