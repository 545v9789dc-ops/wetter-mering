name: Wettermodelle Mering

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC; separate slots identify the intended schedule.
    # Local target times: 05:40 and 15:40 in Europe/Berlin (CET or CEST).
    - cron: "40 3 * * *"
    - cron: "40 4 * * *"
    - cron: "40 13 * * *"
    - cron: "40 14 * * *"
    # Additional model refresh every three hours (UTC).
    - cron: "10 */3 * * *"

permissions:
  contents: write

concurrency:
  group: mering-model-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check intended Berlin schedule slot
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$SCHEDULE_CRON" == "10 */3 * * *" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scheduled_utc_hour=$(awk '{print $2}' <<< "$SCHEDULE_CRON")
          intended_local_hour=$(TZ=Europe/Berlin date -d "$(date -u +%F) ${scheduled_utc_hour}:40 UTC" +%H)
          if [[ "$intended_local_hour" == "05" || "$intended_local_hour" == "15" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Scheduled UTC hour: $scheduled_utc_hour; intended Berlin hour: $intended_local_hour"

      - name: Checkout
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test forecast validation
        if: steps.clock.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Fetch model data
        id: fetch
        if: steps.clock.outputs.run == 'true'
        run: python scripts/fetch_models.py

      - name: Fetch MOSMIX data (non-critical)
        if: steps.clock.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_mosmix.py

      - name: Fetch ensemble data (non-critical)
        if: steps.clock.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_ensembles.py

      - name: Commit JSON
        if: always() && steps.fetch.outcome != 'skipped' && steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mering_models.json
          if [[ -f data/mering_mosmix.json ]]; then
            git add data/mering_mosmix.json
          fi
          if [[ -f data/mering_ensembles.json ]]; then
            git add data/mering_ensembles.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Mering model, MOSMIX and ensemble data"
            git push
          fi
