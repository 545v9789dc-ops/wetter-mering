name: Wettermodelle Mering

on:
  workflow_dispatch:
  schedule:
    # Separate entries make github.event.schedule identify the UTC slot.
    # Berlin targets: 02:00, 05:00, 10:00, 15:00, 18:00, 21:30.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: mering-model-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Berlin local schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/weather_schedule.py

      - name: Set up Python
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test forecast validation
        if: steps.clock.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Fetch model data
        id: fetch
        if: steps.clock.outputs.run == 'true'
        run: python scripts/fetch_models.py

      - name: Fetch MOSMIX data (non-critical)
        if: steps.clock.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_mosmix.py

      - name: Fetch ensemble data (non-critical)
        if: steps.clock.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/fetch_ensembles.py

      - name: Commit JSON
        if: always() && steps.fetch.outcome != 'skipped' && steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mering_models.json
          if [[ -f data/mering_mosmix.json ]]; then
            git add data/mering_mosmix.json
          fi
          if [[ -f data/mering_ensembles.json ]]; then
            git add data/mering_ensembles.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Mering model, MOSMIX and ensemble data"
            git push
          fi
