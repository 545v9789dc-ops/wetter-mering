name: DWD Synoptik Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dwd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test DWD synoptic overview
        id: test
        continue-on-error: true
        run: python scripts/test_dwd_synoptik.py
      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwd-synoptik-test-result
          path: data/dwd_synoptik_test.json
          if-no-files-found: warn
      - name: Show test result
        if: always()
        run: |
          if [ -f data/dwd_synoptik_test.json ]; then
            cat data/dwd_synoptik_test.json
          else
            echo 'No test result was produced.'
          fi
