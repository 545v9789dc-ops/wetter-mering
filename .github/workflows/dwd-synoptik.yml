name: DWD Synoptik Mering

on:
  workflow_dispatch:
  schedule:
    # 05:15 Europe/Berlin (03:15 UTC in summer, 04:15 UTC in winter).
    # Both UTC slots are scheduled; the time check below skips the wrong one.
    # Remaining four UTC slots are unchanged.
    - cron: '15 3,4,9,13,17,21 * * *'

permissions:
  contents: write

concurrency:
  group: dwd-synoptik-main
  cancel-in-progress: false

jobs:
  fetch-synoptik:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check scheduled local time
        id: schedule_check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # For the two additional early UTC slots, only execute the one
          # corresponding to 05:15 local time in Europe/Berlin.
          if [ "$EVENT_NAME" = "schedule" ]; then
            utc_hour=$(date -u +%H)
            if [ "$utc_hour" = "03" ] || [ "$utc_hour" = "04" ]; then
              local_hour=$(TZ=Europe/Berlin date +%H)
              if [ "$local_hour" != "05" ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "Skipping non-local-05:15 scheduled run."
                exit 0
              fi
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download DWD synoptic reports
        if: steps.schedule_check.outputs.run == 'true'
        id: download
        continue-on-error: true
        run: python scripts/fetch_dwd_synoptik.py
      - name: Save reports to repository
        if: steps.schedule_check.outputs.run == 'true'
        run: |
          if [ ! -f data/dwd_synoptik.json ]; then
            echo 'No report file generated.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dwd_synoptik.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update DWD synoptic reports'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload diagnostic result
        if: always() && steps.schedule_check.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dwd-synoptik-result
          path: data/dwd_synoptik.json
          if-no-files-found: warn
      - name: Flag failed download
        if: steps.schedule_check.outputs.run == 'true' && steps.download.outcome == 'failure'
        run: |
          echo 'One or more DWD reports could not be downloaded. Check JSON statuses.'
          exit 1
