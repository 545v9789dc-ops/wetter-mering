name: DWD Synoptik Mering

on:
  workflow_dispatch:
  schedule:
    # 05:15 Europe/Berlin (03:15 UTC in summer, 04:15 UTC in winter).
    # Separate cron expressions identify the scheduled slot even if GitHub runs late.
    # Remaining four UTC slots are unchanged.
    - cron: '15 3 * * *'
    - cron: '15 4 * * *'
    - cron: '15 9,13,17,21 * * *'

permissions:
  contents: write

concurrency:
  group: dwd-synoptik-main
  cancel-in-progress: false

jobs:
  fetch-synoptik:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check scheduled local time
        id: schedule_check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # The cron expression identifies the scheduled slot, not the runner start.
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '15 3 * * *'|'15 4 * * *')
                local_date=$(TZ=Europe/Berlin date +%F)
                offset=$(TZ=Europe/Berlin date -d "${local_date} 05:15" +%z)
                case "$offset" in
                  +0200) expected='15 3 * * *' ;;
                  +0100) expected='15 4 * * *' ;;
                  *) echo "Unexpected Berlin UTC offset: $offset"; exit 1 ;;
                esac
                if [ "$SCHEDULE" != "$expected" ]; then
                  echo "run=false" >> "$GITHUB_OUTPUT"
                  echo "Skipping wrong seasonal 05:15 UTC slot."
                  exit 0
                fi
                ;;
            esac
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download DWD synoptic reports
        if: steps.schedule_check.outputs.run == 'true'
        id: download
        continue-on-error: true
        run: python scripts/fetch_dwd_synoptik.py
      - name: Save reports to repository
        if: steps.schedule_check.outputs.run == 'true'
        run: |
          if [ ! -f data/dwd_synoptik.json ]; then
            echo 'No report file generated.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dwd_synoptik.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update DWD synoptic reports'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload diagnostic result
        if: always() && steps.schedule_check.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: dwd-synoptik-result
          path: data/dwd_synoptik.json
          if-no-files-found: warn
      - name: Flag failed download
        if: steps.schedule_check.outputs.run == 'true' && steps.download.outcome == 'failure'
        run: |
          echo 'One or more DWD reports could not be downloaded. Check JSON statuses.'
          exit 1
