name: DWD Synoptik Mering

on:
  workflow_dispatch:
  schedule:
    # Fixed UTC times year-round. No seasonal duplicates.
    - cron: '15 4 * * *'
    - cron: '15 10 * * *'
    - cron: '15 14 * * *'
    - cron: '15 18 * * *'

permissions:
  contents: write

concurrency:
  group: dwd-synoptik-main
  cancel-in-progress: false

jobs:
  fetch-synoptik:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Confirm schedule
        id: schedule_check
        run: echo 'run=true' >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Download DWD synoptic reports
        if: steps.schedule_check.outputs.run == 'true'
        id: download
        continue-on-error: true
        run: python scripts/fetch_dwd_synoptik.py
      - name: Annotate DWD availability and cache quality
        if: steps.schedule_check.outputs.run == 'true' && hashFiles('data/dwd_synoptik.json') != ''
        run: python scripts/annotate_dwd_quality.py
      - name: Save reports to repository
        if: steps.schedule_check.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ ! -f data/dwd_synoptik.json ]; then
            echo 'No report file generated.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dwd_synoptik.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update DWD synoptic reports'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'DWD rebase conflict; no force push.' >&2
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 3)); fi
            done
            echo 'DWD push failed after three attempts.' >&2
            exit 1
          fi
      - name: Upload diagnostic result
        if: always() && steps.schedule_check.outputs.run == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dwd-synoptik-result
          path: data/dwd_synoptik.json
          if-no-files-found: warn
      - name: Flag failed download
        if: steps.schedule_check.outputs.run == 'true' && steps.download.outcome == 'failure'
        run: |
          echo 'One or more DWD reports could not be downloaded. Check JSON statuses.'
          exit 1
