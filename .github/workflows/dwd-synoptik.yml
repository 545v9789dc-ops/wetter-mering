name: DWD Synoptik Mering

on:
  workflow_dispatch:
  schedule:
    # 05:15 Europe/Berlin (03:15 UTC summer, 04:15 UTC winter).
    - cron: '15 3 * * *'
    - cron: '15 4 * * *'
    - cron: '15 9,13,17,21 * * *'

permissions:
  contents: write

concurrency:
  group: dwd-synoptik-main
  cancel-in-progress: false

jobs:
  fetch-synoptik:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check scheduled local time
        id: schedule_check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '15 3 * * *'|'15 4 * * *')
                local_date=$(TZ=Europe/Berlin date +%F)
                offset=$(TZ=Europe/Berlin date -d "${local_date} 05:15" +%z)
                case "$offset" in
                  +0200) expected='15 3 * * *' ;;
                  +0100) expected='15 4 * * *' ;;
                  *) echo "Unexpected Berlin UTC offset: $offset"; exit 1 ;;
                esac
                if [ "$SCHEDULE" != "$expected" ]; then
                  echo "run=false" >> "$GITHUB_OUTPUT"
                  echo "Skipping wrong seasonal 05:15 UTC slot."
                  exit 0
                fi
                ;;
            esac
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Download DWD synoptic reports
        if: steps.schedule_check.outputs.run == 'true'
        id: download
        continue-on-error: true
        run: python scripts/fetch_dwd_synoptik.py
      - name: Annotate DWD availability and cache quality
        if: steps.schedule_check.outputs.run == 'true' && hashFiles('data/dwd_synoptik.json') != ''
        run: python scripts/annotate_dwd_quality.py
      - name: Save reports to repository
        if: steps.schedule_check.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ ! -f data/dwd_synoptik.json ]; then
            echo 'No report file generated.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dwd_synoptik.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update DWD synoptic reports'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'DWD rebase conflict; no force push.' >&2
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 3)); fi
            done
            echo 'DWD push failed after three attempts.' >&2
            exit 1
          fi
      - name: Upload diagnostic result
        if: always() && steps.schedule_check.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dwd-synoptik-result
          path: data/dwd_synoptik.json
          if-no-files-found: warn
      - name: Flag failed download
        if: steps.schedule_check.outputs.run == 'true' && steps.download.outcome == 'failure'
        run: |
          echo 'One or more DWD reports could not be downloaded. Check JSON statuses.'
          exit 1
