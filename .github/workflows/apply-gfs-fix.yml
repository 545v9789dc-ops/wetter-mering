name: Apply GFS network fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch existing collector
        run: python scripts/patch_gfs.py
      - name: Check Python syntax
        run: python -m py_compile scripts/fetch_models.py
      - name: Commit repaired collector
        run: |
          if ! git diff --quiet -- scripts/fetch_models.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/fetch_models.py
            git commit -m "Improve Open-Meteo network timeout and retries"
            git push
          fi
