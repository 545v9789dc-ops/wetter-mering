name: Cron Scheduler Test

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions: {}

jobs:
  scheduler-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Log scheduler event and time
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Cron: $EVENT_SCHEDULE"
          date -u '+UTC: %Y-%m-%d %H:%M:%S'
          TZ=Europe/Berlin date '+Berlin: %Y-%m-%d %H:%M:%S %Z'
